name: Mirror Bingner Historic Indices

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch and remap Bingner indices
        shell: bash
        run: |
          set -euo pipefail
          GRY='\033[0;37m'; GRN='\033[0;32m'; YLW='\033[1;33m'; N='\033[0m'
          BASE="https://apt.bingner.com"
          OUT="${GITHUB_WORKSPACE}/bingner"
          SUCCESS=0

          mkdir -p "${OUT}"

          echo -e "${GRY}[>] Discovering versions${N}"
          HTML=$(curl -fsSL --max-time 60 "${BASE}/debs/" 2>/dev/null || true)
          VERSIONS=$(echo "$HTML" | grep -oE '>[0-9.]+/</a>' | sed 's/>//;s/<\/a>//;s/\/$//' | sort -V)

          for VER in $VERSIONS; do
            echo -e "${GRY}[>] ${VER}${N}"
            URL="${BASE}/dists/ios/${VER}/main/binary-iphoneos-arm/Packages"
            DIR="${OUT}/dists/ios/${VER}/main/binary-iphoneos-arm64"
            PKG="${DIR}/Packages"
            mkdir -p "${DIR}"

            echo -e "  ${GRY}=> Fetching Packages${N}"
            if ! curl -fsSL --max-time 60 "${URL}" -o "${PKG}.tmp" 2>/dev/null; then
              echo -e "  ${YLW}[!] Fetch failed, skipping${N}"
              rm -f "${PKG}.tmp"; rm -rf "${DIR}"
              continue
            fi

            if [[ ! -s "${PKG}.tmp" ]]; then
              echo -e "  ${YLW}[!] Empty index, skipping${N}"
              rm -f "${PKG}.tmp"; rm -rf "${DIR}"
              continue
            fi

            echo -e "  ${GRY}=> Rewriting Architecture to iphoneos-arm64${N}"
            sed -E 's/^Architecture: .*$/Architecture: iphoneos-arm64/' "${PKG}.tmp" > "${PKG}"

            echo -e "  ${GRY}=> Rewriting Filename to Bingner origin${N}"
            sed -i 's|^Filename: \./|Filename: https://apt.bingner.com/|' "${PKG}"
            rm -f "${PKG}.tmp"

            echo -e "  ${GRY}=> Compressing index${N}"
            gzip -9fk "${PKG}"
            bzip2 -9fk "${PKG}"

            echo -e "  ${GRY}=> Generating Release${N}"
            cd "${DIR}"
            SZ=$(stat -c%s Packages);   M=$(md5sum Packages | cut -d' ' -f1);     S=$(sha256sum Packages | cut -d' ' -f1)
            GZ=$(stat -c%s Packages.gz); GM=$(md5sum Packages.gz | cut -d' ' -f1); GS=$(sha256sum Packages.gz | cut -d' ' -f1)
            BZ=$(stat -c%s Packages.bz2);BM=$(md5sum Packages.bz2 | cut -d' ' -f1);BS=$(sha256sum Packages.bz2 | cut -d' ' -f1)

            cat > ../Release <<EOF
          Origin: Bingner
          Label: Bingner Mirror (iphoneos-arm64)
          Suite: ${VER}
          Version: 1.0
          Codename: ios
          Architectures: iphoneos-arm64
          Components: main
          MD5Sum:
           ${M} ${SZ} main/binary-iphoneos-arm64/Packages
           ${GM} ${GZ} main/binary-iphoneos-arm64/Packages.gz
           ${BM} ${BZ} main/binary-iphoneos-arm64/Packages.bz2
          SHA256:
           ${S} ${SZ} main/binary-iphoneos-arm64/Packages
           ${GS} ${GZ} main/binary-iphoneos-arm64/Packages.gz
           ${BS} ${BZ} main/binary-iphoneos-arm64/Packages.bz2
          EOF
            cd "${GITHUB_WORKSPACE}"
            LINES=$(grep -c '^Package:' "${PKG}" || true)
            echo -e "  ${GRN}✓${N} ${VER}: ${LINES} packages"
            SUCCESS=$((SUCCESS + 1))
          done

          if [ "$SUCCESS" -eq 0 ]; then
            echo -e "${YLW}[!] All versions failed or empty${N}"
            exit 1
          fi

      - name: GPG Sign Release
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          GRY='\033[0;37m'; GRN='\033[0;32m'; YLW='\033[1;33m'; N='\033[0m'
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo -e "${YLW}[!] GPG_PRIVATE_KEY not set, skipping signing${N}"
            exit 0
          fi
          echo -e "${GRY}[>] Importing GPG key${N}"
          echo "$GPG_PRIVATE_KEY" | gpg --import --batch --yes 2>/dev/null
          for REL in bingner/dists/ios/*/Release; do
            if [ -f "$REL" ]; then
              DIR=$(dirname "$REL")
              VER=$(basename "$DIR")
              echo -e "  ${GRY}=> Signing Bingner ${VER}${N}"
              gpg --default-key "$GPG_KEY_ID" --batch --yes --clearsign \
                -o "$DIR/InRelease" "$REL"
              gpg --default-key "$GPG_KEY_ID" --batch --yes -abs \
                -o "$DIR/Release.gpg" "$REL"
            fi
          done
          echo -e "  ${GRN}✓${N} GPG signatures generated"

      - name: Generate manifest
        shell: bash
        run: |
          cd bingner
          VERSIONS=$(cd dists/ios 2>/dev/null && ls -1d */ 2>/dev/null | sed 's/\/$//' | sort -V)
          JSON="["
          FIRST=1
          for v in $VERSIONS; do
            if [ -f "dists/ios/${v}/main/binary-iphoneos-arm64/Packages" ]; then
              [ $FIRST -eq 0 ] && JSON="${JSON},"
              JSON="${JSON}\"${v}\""
              FIRST=0
            fi
          done
          JSON="${JSON}]"
          echo "{\"versions\":${JSON}}" > manifest.json
          echo "manifest: $(cat manifest.json)"

      - name: Push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bingner/ key.gpg 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "Mirror Bingner historic indices $(date +%Y%m%d-%H%M)"; git push; }