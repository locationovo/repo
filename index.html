<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repo</title>
<link rel="stylesheet" href="style.css">
<style>
body { display: flex; }

aside {
    width: 180px;
    background: var(--card-bg);
    border-right: 1px solid var(--border);
    padding: 30px 20px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
aside a,
aside button {
    display: block;
    color: var(--text-secondary);
    font-size: 13px;
    text-decoration: none;
    padding: 6px 0;
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    line-height: 1.8;
}
aside a:hover,
aside button:hover { color: var(--text-primary); }

main {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 20px;
    overflow-y: auto;
}

.wrapper {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
}
.box {
    text-align: center;
    width: 100%;
    background: var(--card-bg);
    border-radius: 16px;
    padding: 36px 28px 28px;
    box-shadow: var(--card-shadow);
}
.icon {
    width: 64px; height: 64px;
    margin: 0 auto 16px;
    border-radius: 16px;
    background: url(icon.png) center/cover no-repeat;
}
.box h1 { font-size: 24px; font-weight: 700; color: var(--text-primary); }
.box .tag { color: var(--text-muted); font-size: 13px; margin: 2px 0 24px; }

.help-link {
    position: fixed;
    bottom: 20px;
    right: 20px;
    font-size: 12px;
    color: var(--text-muted);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 8px;
    transition: color .15s, background .15s;
    z-index: 100;
}
.help-link:hover {
    color: var(--text-secondary);
    background: var(--hover-bg);
}

.overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.4);
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: 60px;
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
}
.overlay.open { opacity: 1; pointer-events: auto; }
.search-modal {
    width: 100%; max-width: 520px; max-height: 82vh;
    background: var(--card-bg); border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    display: flex; flex-direction: column;
    overflow: hidden;
    transform: translateY(12px);
    transition: transform .25s;
}
.overlay.open .search-modal { transform: translateY(0); }
.search-modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px 0;
}
.search-modal-header h2 {
    font-size: 16px; font-weight: 600; color: var(--text-primary);
    display: flex; align-items: center; gap: 8px;
}
.close-btn {
    width: 30px; height: 30px;
    border: none; background: none; cursor: pointer;
    border-radius: 50%; display: flex; align-items: center;
    justify-content: center; color: var(--text-muted); font-size: 18px;
    transition: color .15s, background .15s;
    flex-shrink: 0;
}
.close-btn:hover { color: var(--text-primary); background: var(--hover-bg); }

.search-modal-body { padding: 14px 22px 22px; overflow: hidden; display: flex; flex-direction: column; }

.scope-panel {
    margin-bottom: 10px;
    border: 1px solid var(--btn-border);
    border-radius: 10px;
    background: var(--btn-hover-bg);
    overflow: hidden;
}
.scope-all {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 13px; font-weight: 600; color: var(--text-secondary);
    cursor: pointer;
    user-select: none;
}
.scope-list {
    max-height: 132px;
    overflow-y: auto;
    padding: 4px 0;
}
.scope-list::-webkit-scrollbar { width: 5px; }
.scope-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }
.scope-group-title {
    font-size: 11px;
    color: var(--text-muted);
    padding: 6px 14px 2px;
    letter-spacing: 0.4px;
}
.scope-item {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 14px;
    font-size: 13px; color: var(--text-secondary);
    cursor: pointer;
    transition: background .12s;
    user-select: none;
}
.scope-item:hover { background: var(--hover-bg); }
.scope-item input,
.scope-all input {
    accent-color: var(--text-secondary);
    width: 14px; height: 14px;
    flex-shrink: 0;
    cursor: pointer;
}

.search-row { display: flex; gap: 10px; align-items: center; }
.search-input-wrap { flex: 1; position: relative; }
.search-input-wrap input {
    width: 100%; padding: 10px 36px 10px 14px;
    border: 1px solid var(--btn-border); border-radius: 10px;
    font-size: 14px; font-family: inherit; color: var(--fg);
    background: var(--btn-hover-bg); outline: none;
    transition: border-color .2s, background .2s, box-shadow .2s;
}
.search-input-wrap input:focus {
    border-color: var(--text-muted); background: var(--card-bg);
    box-shadow: 0 0 0 3px rgba(0,0,0,0.04);
}
.search-input-wrap input::placeholder { color: var(--text-faint); }
.search-input-wrap .clear-btn {
    position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%); width: 22px; height: 22px;
    border: none; background: none; cursor: pointer;
    border-radius: 50%; display: flex; align-items: center;
    justify-content: center; color: var(--text-muted); font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .15s;
}
.search-input-wrap .clear-btn.visible { opacity: 1; pointer-events: auto; }
.search-input-wrap .clear-btn:hover { color: var(--text-primary); background: var(--hover-bg); }

.results-area {
    margin-top: 14px; max-height: 340px; overflow-y: auto;
    border-radius: 10px;
}
.results-area::-webkit-scrollbar { width: 5px; }
.results-area::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }

.result-item {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 4px;
    transition: background .12s;
}
.result-item:last-child { border-bottom: none; }
.result-item:hover { background: var(--btn-hover-bg); }
.result-item .pkg-name {
    font-weight: 600; font-size: 14px; color: var(--text-primary);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.result-item .pkg-name .version-badge {
    font-weight: 400; font-size: 11px; color: var(--text-muted);
    background: var(--hover-bg); padding: 2px 8px; border-radius: 20px;
}
.result-item .pkg-name .mirror-badge {
    font-weight: 400; font-size: 10px; color: var(--text-muted);
    background: var(--btn-hover-bg); padding: 2px 6px; border-radius: 20px;
    border: 1px solid var(--border);
}
.result-item .pkg-desc {
    font-size: 12px; color: var(--text-muted); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
}
.result-item .pkg-meta { font-size: 11px; color: var(--text-faint); display: flex; gap: 12px; flex-wrap: wrap; }
.result-item .dl-link {
    font-size: 12px; color: var(--text-secondary); text-decoration: none;
    align-self: flex-start; padding: 4px 12px;
    border: 1px solid var(--border); border-radius: 6px;
    transition: border-color .15s, background .15s;
}
.result-item .dl-link:hover { border-color: var(--btn-hover-border); background: var(--btn-hover-bg); }

.status-msg { text-align: center; padding: 28px 16px; color: var(--text-muted); font-size: 13px; }
.highlight { background: #fff3b0; border-radius: 2px; padding: 0 1px; }

@media (prefers-color-scheme: dark) {
    .highlight { background: #5a4a00; color: #ffe066; }
}

@media (max-width: 600px) {
    body { flex-direction: column; }
    aside {
        width: 100%; border-right: none; border-bottom: 1px solid var(--border);
        padding: 14px 20px; flex-direction: row; gap: 18px;
        flex-wrap: wrap;
    }
    main { padding: 24px 16px; }
    .wrapper { max-width: 100%; gap: 16px; }
    .box { padding: 24px 18px 20px; }
    .overlay { padding-top: 32px; }
    .search-modal { max-width: 94vw; max-height: 88vh; }
    .scope-list { max-height: 108px; }
    .results-area { max-height: 240px; }
}
</style>
</head>
<body>

<aside>
    <a href="https://github.com/locationovo" target="_blank">我的主页</a>
    <a href="https://github.com/locationovo/repo" target="_blank">仓库地址</a>
    <button id="searchBtn">搜索插件</button>
</aside>

<main>
    <div class="wrapper">
        <div class="box">
            <div class="icon" style="background: url(icon.png) center/cover no-repeat;"></div>
            <h1>添加插件源</h1>
            <p class="tag">locationovo 个人插件源</p>

            <a class="btn" href="irisin://repository/add?url=https://locationovo.github.io/repo/&suite=stable&component=main">
                添加到 Irisin
            </a>
            <a class="btn" href="sileo://source/https://locationovo.github.io/repo/?suites=stable&components=main">
                添加到 Sileo
            </a>
            <button class="btn" id="copyBtn">
                复制源地址
            </button>
            <p class="footer">GitHub Pages 托管</p>
        </div>
    </div>
</main>

<a href="help.html" class="help-link">帮助</a>

<div class="overlay" id="overlay">
    <div class="search-modal">
        <div class="search-modal-header">
            <h2>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                搜索插件
            </h2>
            <button class="close-btn" id="closeBtn" aria-label="关闭">&#x2715;</button>
        </div>
        <div class="search-modal-body">
            <div class="scope-panel">
                <label class="scope-all">
                    <input type="checkbox" id="selectAll">
                    全选
                </label>
                <div class="scope-list" id="scopeList"></div>
            </div>
            <div class="search-row">
                <div class="search-input-wrap">
                    <input type="text" id="searchInput" placeholder="输入插件名或关键词" autocomplete="off">
                    <button class="clear-btn" id="clearBtn" aria-label="清除">&#x2715;</button>
                </div>
            </div>
            <div class="results-area" id="resultsArea"></div>
        </div>
    </div>
</div>

<script>
(function() {
    var overlay = document.getElementById('overlay');
    var searchBtn = document.getElementById('searchBtn');
    var closeBtn = document.getElementById('closeBtn');
    var searchInput = document.getElementById('searchInput');
    var clearBtn = document.getElementById('clearBtn');
    var resultsArea = document.getElementById('resultsArea');
    var scopeList = document.getElementById('scopeList');
    var selectAllBox = document.getElementById('selectAll');
    var copyBtn = document.getElementById('copyBtn');

    var SOURCE_URL = 'https://locationovo.github.io/repo/';

    var STATIC_GROUPS = [
        {
            name: '主源',
            sources: [
                { id: 'main-arm64', label: 'iphoneos-arm64', url: './dists/stable/main/binary-iphoneos-arm64/Packages', base: './dists/stable/main/binary-iphoneos-arm64/', defaultOn: true },
                { id: 'main-arm64e', label: 'iphoneos-arm64e', url: './dists/stable/main/binary-iphoneos-arm64e/Packages', base: './dists/stable/main/binary-iphoneos-arm64e/', defaultOn: true }
            ]
        }
    ];

    var SOURCE_GROUPS = STATIC_GROUPS.slice();
    var ALL_SOURCES = [];
    var sourceCache = {};
    var pendingCache = {};
    var currentPackages = [];
    var timer = null;

    function rebuildAllSources() {
        ALL_SOURCES = [];
        SOURCE_GROUPS.forEach(function(g) {
            g.sources.forEach(function(s) { ALL_SOURCES.push(s); });
        });
    }

    function buildDynamicGroups(procursusVersions, bingnerVersions) {
        var groups = [];
        if (procursusVersions && procursusVersions.length) {
            groups.push({
                name: 'Procursus 镜像',
                sources: procursusVersions.map(function(v) {
                    return {
                        id: 'procursus-' + v,
                        label: v,
                        url: './procursus/dists/' + v + '/main/binary-iphoneos-arm64/Packages',
                        base: './procursus/dists/' + v + '/main/binary-iphoneos-arm64/'
                    };
                })
            });
        }
        if (bingnerVersions && bingnerVersions.length) {
            groups.push({
                name: 'Bingner 镜像',
                sources: bingnerVersions.map(function(v) {
                    return {
                        id: 'bingner-' + v,
                        label: v,
                        url: './bingner/dists/ios/' + v + '/main/binary-iphoneos-arm64/Packages',
                        base: './bingner/dists/ios/' + v + '/main/binary-iphoneos-arm64/'
                    };
                })
            });
        }
        return groups;
    }

    function fetchManifest(path) {
        return fetch(path)
            .then(function(r) { return r.ok ? r.json() : { versions: [] }; })
            .then(function(j) { return (j && j.versions) || []; })
            .catch(function() { return []; });
    }

    function loadManifests() {
        return Promise.all([
            fetchManifest('./procursus/manifest.json'),
            fetchManifest('./bingner/manifest.json')
        ]).then(function(results) {
            var dynamicGroups = buildDynamicGroups(results[0], results[1]);
            SOURCE_GROUPS = STATIC_GROUPS.concat(dynamicGroups);
            rebuildAllSources();
        });
    }

    function renderScope() {
        var previous = {};
        var existing = scopeList.querySelectorAll('input[type="checkbox"]');
        for (var i = 0; i < existing.length; i++) {
            previous[existing[i].getAttribute('data-source-id')] = existing[i].checked;
        }

        var html = '';
        SOURCE_GROUPS.forEach(function(g) {
            html += '<div class="scope-group-title">' + escapeHtml(g.name) + '</div>';
            g.sources.forEach(function(s) {
                var checkedAttr;
                if (s.id in previous) {
                    checkedAttr = previous[s.id] ? ' checked' : '';
                } else {
                    checkedAttr = s.defaultOn ? ' checked' : '';
                }
                html += '<label class="scope-item">';
                html += '<input type="checkbox" data-source-id="' + escapeHtml(s.id) + '"' + checkedAttr + '>';
                html += '<span>' + escapeHtml(s.label) + '</span>';
                html += '</label>';
            });
        });
        scopeList.innerHTML = html;
    }

    function getSelectedIds() {
        var boxes = scopeList.querySelectorAll('input[type="checkbox"]');
        var ids = [];
        for (var i = 0; i < boxes.length; i++) {
            if (boxes[i].checked) ids.push(boxes[i].getAttribute('data-source-id'));
        }
        return ids;
    }

    function syncSelectAllState() {
        var boxes = scopeList.querySelectorAll('input[type="checkbox"]');
        var total = boxes.length;
        var checked = 0;
        for (var i = 0; i < total; i++) if (boxes[i].checked) checked++;
        if (checked === 0) {
            selectAllBox.checked = false;
            selectAllBox.indeterminate = false;
        } else if (checked === total) {
            selectAllBox.checked = true;
            selectAllBox.indeterminate = false;
        } else {
            selectAllBox.checked = false;
            selectAllBox.indeterminate = true;
        }
    }

    function parsePackages(text) {
        var list = [];
        var blocks = text.split(/\n\n+/);
        for (var i = 0; i < blocks.length; i++) {
            var trimmed = blocks[i].trim();
            if (!trimmed) continue;
            var entry = {};
            var lines = trimmed.split('\n');
            var key = '';
            for (var j = 0; j < lines.length; j++) {
                var line = lines[j];
                var ci = line.indexOf(':');
                if (ci > 0 && line[ci + 1] === ' ') {
                    key = line.substring(0, ci).trim();
                    entry[key] = line.substring(ci + 1).trim();
                } else if (key && (line.charAt(0) === ' ' || line.charAt(0) === '\t')) {
                    entry[key] += '\n' + line.trim();
                }
            }
            if (entry.Package) list.push(entry);
        }
        return list;
    }

    function loadSource(src) {
        if (sourceCache[src.id]) return Promise.resolve(sourceCache[src.id]);
        if (pendingCache[src.id]) return pendingCache[src.id];
        
        var promise = fetch(src.url)
            .then(function(r) { return r.ok ? r.text() : ''; })
            .then(function(text) {
                var pkgs = parsePackages(text);
                var absBase;
                try {
                    absBase = new URL(src.base, window.location.href).href;
                } catch(e) {
                    absBase = src.base;
                }
                pkgs.forEach(function(p) {
                    p._source = src.label;
                    if (p.Filename) {
                        try {
                            p._downloadURL = new URL(p.Filename, absBase).href;
                        } catch(e) {
                            p._downloadURL = p.Filename;
                        }
                    }
                });
                sourceCache[src.id] = pkgs;
                return pkgs;
            })
            .catch(function() {
                sourceCache[src.id] = [];
                return [];
            })
            .finally(function() {
                delete pendingCache[src.id];
            });
        
        pendingCache[src.id] = promise;
        return promise;
    }

    function loadSelected(selectedIds) {
        var promises = [];
        selectedIds.forEach(function(id) {
            for (var i = 0; i < ALL_SOURCES.length; i++) {
                if (ALL_SOURCES[i].id === id) {
                    promises.push(loadSource(ALL_SOURCES[i]));
                    break;
                }
            }
        });
        return Promise.all(promises).then(function(results) {
            var all = [];
            var seen = {};
            results.forEach(function(pkgs) {
                pkgs.forEach(function(p) {
                    var key = (p.Package || '') + '|' + (p.Architecture || '') + '|' + (p.Version || '');
                    if (seen[key]) return;
                    seen[key] = true;
                    all.push(p);
                });
            });
            return all;
        });
    }

    function refreshScope() {
        var ids = getSelectedIds();
        if (!ids.length) {
            currentPackages = [];
            resultsArea.innerHTML = '<div class="status-msg">请至少勾选一个搜索范围</div>';
            return;
        }
        resultsArea.innerHTML = '<div class="status-msg">加载中 ...</div>';
        searchInput.value = '';
        clearBtn.classList.remove('visible');
        loadSelected(ids).then(function(packages) {
            currentPackages = packages;
            resultsArea.innerHTML = '<div class="status-msg">共 ' + packages.length + ' 个插件可搜索</div>';
        }).catch(function() {
            currentPackages = [];
            resultsArea.innerHTML = '<div class="status-msg">加载失败，请检查网络后重试</div>';
        });
    }

    function matchScore(p, q) {
        var score = 0;
        var pkg = (p.Package || '').toLowerCase();
        var name = (p.Name || '').toLowerCase();
        var desc = (p.Description || '').toLowerCase();
        var author = (p.Author || '').toLowerCase();

        if (pkg === q) score += 1000;
        if (name === q) score += 900;

        var idx = pkg.indexOf(q);
        if (idx !== -1) score += 800 - idx;
        idx = name.indexOf(q);
        if (idx !== -1) score += 700 - idx;
        idx = desc.indexOf(q);
        if (idx !== -1) score += 500 - idx;
        idx = author.indexOf(q);
        if (idx !== -1) score += 300 - idx;

        return score;
    }

    function search(query) {
        var packages = currentPackages;
        var q = query.trim().toLowerCase();
        if (!q) {
            resultsArea.innerHTML = '<div class="status-msg">共 ' + packages.length + ' 个插件可搜索</div>';
            return;
        }
        var matched = [];
        for (var i = 0; i < packages.length; i++) {
            var p = packages[i];
            var s = [p.Package, p.Name, p.Description, p.Author].join(' ').toLowerCase();
            if (s.indexOf(q) !== -1) {
                matched.push({ pkg: p, score: matchScore(p, q) });
            }
        }
        if (!matched.length) {
            resultsArea.innerHTML = '<div class="status-msg">没有匹配的插件</div>';
            return;
        }
        matched.sort(function(a, b) { return b.score - a.score; });
        var results = matched.map(function(m) { return m.pkg; });
        renderResults(results, q);
    }

    function renderResults(list, query) {
        var html = '';
        for (var i = 0; i < list.length; i++) {
            var p = list[i];
            var name = p.Name || p.Package || '';
            var version = p.Version || '';
            var description = p.Description || '';
            var author = p.Author || '';
            var dl = p._downloadURL || '';

            html += '<div class="result-item">';
            html += '<div class="pkg-name"><span>' + highlight(name, query) + '</span>';
            if (version) {
                html += '<span class="version-badge">v' + escapeHtml(version) + '</span>';
            }
            if (p._source) {
                html += '<span class="mirror-badge">' + escapeHtml(p._source) + '</span>';
            }
            html += '</div>';
            if (description) {
                html += '<div class="pkg-desc">' + highlight(description, query) + '</div>';
            }
            if (author) {
                html += '<div class="pkg-meta"><span>' + escapeHtml(author) + '</span></div>';
            }
            if (dl) {
                html += '<a class="dl-link" href="' + encodeURI(dl) + '" target="_blank" download>下载 .deb</a>';
            }
            html += '</div>';
        }
        resultsArea.innerHTML = html;
    }

    function highlight(text, q) {
        if (!q || !text) return text;
        var escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        var re = new RegExp('(' + escaped + ')', 'gi');
        return text.replace(re, '<span class="highlight">$1</span>');
    }

    function escapeHtml(s) {
        var div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
    }

    function openSearch() {
        overlay.classList.add('open');
        if (!currentPackages.length) {
            refreshScope();
        }
        setTimeout(function() { searchInput.focus(); }, 150);
    }

    function closeSearch() {
        overlay.classList.remove('open');
        searchInput.value = '';
        clearBtn.classList.remove('visible');
    }

    function copySource() {
        var originalText = copyBtn.textContent;
        function showResult(msg) {
            copyBtn.textContent = msg;
            setTimeout(function() { copyBtn.textContent = originalText; }, 1500);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(SOURCE_URL).then(function() {
                showResult('已复制到剪贴板');
            }).catch(function() {
                fallbackCopy();
            });
        } else {
            fallbackCopy();
        }
        function fallbackCopy() {
            var ta = document.createElement('textarea');
            ta.value = SOURCE_URL;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showResult('已复制到剪贴板');
            } catch(e) {
                showResult('复制失败');
            }
            document.body.removeChild(ta);
        }
    }

    rebuildAllSources();
    renderScope();
    syncSelectAllState();

    loadManifests().then(function() {
        renderScope();
        syncSelectAllState();
    });

    searchBtn.addEventListener('click', openSearch);
    closeBtn.addEventListener('click', closeSearch);
    copyBtn.addEventListener('click', copySource);

    overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeSearch();
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && overlay.classList.contains('open')) {
            closeSearch();
        }
    });

    selectAllBox.addEventListener('change', function() {
        var boxes = scopeList.querySelectorAll('input[type="checkbox"]');
        for (var i = 0; i < boxes.length; i++) boxes[i].checked = selectAllBox.checked;
        selectAllBox.indeterminate = false;
        refreshScope();
    });

    scopeList.addEventListener('change', function(e) {
        if (e.target && e.target.type === 'checkbox') {
            syncSelectAllState();
            refreshScope();
        }
    });

    searchInput.addEventListener('input', function() {
        var v = this.value;
        clearBtn.classList.toggle('visible', v.length > 0);
        clearTimeout(timer);
        timer = setTimeout(function() { search(v); }, 200);
    });

    clearBtn.addEventListener('click', function() {
        searchInput.value = '';
        clearBtn.classList.remove('visible');
        search('');
        searchInput.focus();
    });
})();
</script>

</body>
</html>
